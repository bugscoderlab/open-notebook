# Alembic configuration for the analytics PostgreSQL database (ADR-009).
# The URL is NOT stored here — env.py reads ANALYTICS_DATABASE_URL at runtime
# (default: postgresql+asyncpg://z@localhost:5432/open_notebook_analytics).
[alembic]
script_location = open_notebook/analytics/alembic
prepend_sys_path = .
# timezone is handled by the database; keep alembic output deterministic
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
