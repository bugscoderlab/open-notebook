      "--bg": "#17181b", "--bg-deep": "#121316", "--surface": "#1e2024", "--raised": "#24262b",

      "--danger": "#df7c63",
    },
  };
  function applyTheme(mode) {
    const vars = T[mode];
    for (const [k, v] of Object.entries(vars)) document.documentElement.style.setProperty(k, v);
    document.documentElement.classList.toggle("dark", mode === "dark");
    document.documentElement.style.colorScheme = mode;
    localStorage.setItem("proto-theme", mode);
  }
  applyTheme(localStorage.getItem("proto-theme") || "light");

  tailwind.config = {
    theme: {
      extend: {
        colors: {

<style>
  /* motion — quick and quiet */
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: no-preference) {
    .rise { animation: rise 0.35s cubic-bezier(0.16, 1, 0.3, 1) both; animation-delay: calc(var(--i, 0) * 45ms); }
  }
  .card-hover { transition: background-color 0.15s ease-out, box-shadow 0.15s ease-out, border-color 0.15s ease-out; cursor: pointer; }
  .card-hover:hover { background-color: var(--raised) !important; box-shadow: 0 1px 3px rgba(35, 37, 42, 0.1); }
  .rail { scrollbar-width: thin; scrollbar-color: var(--ink-faintest) transparent; }
  .rail::-webkit-scrollbar { height: 6px; }
  .rail::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  ::selection { background: var(--fern-tint); }

  /* processing pulse */
  @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  .pulse { animation: pulse-dot 1.6s ease-in-out infinite; }

  /* prose sample (source reader) */
  .reader p { margin-bottom: 1em; line-height: 1.75; color: var(--ink-soft); }
  .reader p:first-of-type::first-letter { }
  mark { background: var(--fern-tint); color: inherit; border-radius: 2px; padding: 0 1px; }
  .annot { background: var(--teal-tint); border-bottom: 1px dashed var(--teal); cursor: help; }

  /* toggle switch */
  .switch { position: relative; width: 34px; height: 20px; border-radius: 999px; background: var(--line); transition: background 0.15s ease; cursor: pointer; flex-shrink: 0; border: none; padding: 0; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 999px; background: var(--raised); box-shadow: 0 1px 2px rgba(35,37,42,0.25); transition: transform 0.15s cubic-bezier(0.16,1,0.3,1); }
  .switch[aria-checked="true"] { background: var(--fern); }
  .switch[aria-checked="true"]::after { transform: translateX(14px); }

  /* toast */
  #toast { transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.16,1,0.3,1); }

  /* chat */
  .bubble { max-width: 75%; }

  /* scope panel overlay dim (color-mix so it works with CSS-var tokens) */
  #scope-overlay { background: color-mix(in srgb, var(--ink) 16%, transparent); }
</style>
</head>

function markActiveNav() {
  $$(".nav-item").forEach((a) => {
    const active = a.dataset.page === currentPage || (!currentPage && a.dataset.page === "home") || (currentPage === "home" && a.dataset.page === "home");
    a.classList.toggle("bg-surface", active);
    a.classList.toggle("font-semibold", active);
    a.classList.toggle("text-ink", active);
    a.classList.toggle("ring-1", active);
    a.classList.toggle("ring-inset", active);
    a.classList.toggle("ring-line", active);
    a.classList.toggle("text-ink-soft", !active);
    const rail = a.querySelector(".nav-rail");
    if (rail) rail.classList.toggle("hidden", !active);
    const icon = a.querySelector("svg");
    if (icon) icon.classList.toggle("text-teal", active);
  });
}

function toggleSidebar() {
  sidebarCollapsed = !sidebarCollapsed;
  const sb = $("#sidebar");
  sb.classList.toggle("w-64", !sidebarCollapsed);
  sb.classList.toggle("w-16", sidebarCollapsed);
  document.querySelectorAll(".sidebar-label").forEach((el) => el.classList.toggle("hidden", sidebarCollapsed));
  document.querySelectorAll(".sidebar-extra").forEach((el) => el.classList.toggle("hidden", sidebarCollapsed));
  document.querySelectorAll(".sidebar-brand span:last-child").forEach((el) => el.classList.toggle("hidden", sidebarCollapsed));
  $("#chev").style.transform = sidebarCollapsed ? "rotate(180deg)" : "";
}

      <span class="ml-auto font-mono text-xs tabular-nums text-ink-faint ${collapsible ? "mr-1" : ""}">${count}</span>

}

function renderRecent(q) {
  const items = RECENT.filter((r) => r.title.toLowerCase().includes(q));
  const sec = $("#recent-section");
  if (!items.length) { sec.innerHTML = ""; sec.classList.add("hidden"); return; }
  sec.classList.remove("hidden");
  sec.innerHTML = `
    ${sectionHeader("Recently Viewed", items.length, { collapsible: true, open: recentOpen, ontoggle: "toggleRecent()" })}
    ${recentOpen ? `
      <div class="rail -mx-1 flex snap-x gap-3 overflow-x-auto px-1 pb-1">
        ${items.map((r) => `
          <a href="#" class="group w-[240px] shrink-0 snap-start rounded-md border border-line bg-surface px-3 py-2.5 card-hover">
            <div class="flex items-center gap-3">
              <div class="flex h-7 w-7 shrink-0 items-center justify-center rounded-md bg-recessed ${r.type === "notebook" ? "text-teal" : "text-sage"}">${r.type === "notebook" ? ICONS.book : ICONS.file.replace('class="w-3 h-3"', 'class="w-3.5 h-3.5"')}</div>
              <div class="min-w-0 flex-1">
                <p class="truncate text-sm font-medium">${esc(r.title)}</p>
                <p class="mt-0.5 truncate font-mono text-[11px] text-ink-faint">${r.when}</p>
              </div>
            </div>
            <span class="mt-2 block text-[10px] font-semibold uppercase tracking-wider text-ink-faint/70">${r.type === "notebook" ? "Notebook" : "Source"}</span>
          </a>`).join("")}
      </div>` : ""}`;
}

function renderNotebookSection(elId, title, list, q, { collapsible = false, open = true, ontoggle = "" } = {}) {
  const sec = $(elId);
  const filtered = list.filter((n) => n.name.toLowerCase().includes(q) || n.description.toLowerCase().includes(q));
  if (!filtered.length && collapsible) { sec.innerHTML = ""; sec.classList.add("hidden"); return; }
  sec.classList.remove("hidden");
  let body;
  if (!filtered.length) {
    body = emptyState("No results", "Try a different search term.", null);
  } else if (view === "tile") {
    body = `<div class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3">${filtered.map((n, i) => tileCard(n, i)).join("")}</div>`;
  } else {
    body = `<div class="divide-y divide-line overflow-hidden rounded-lg border border-line bg-surface">${filtered.map((n, i) => rowItem(n, i)).join("")}</div>`;
  }
  sec.innerHTML = `${sectionHeader(title, filtered.length, { collapsible, open, ontoggle })}
    ${collapsible && !open ? "" : body}`;
}

function setView(v) { view = v; localStorage.setItem("proto-view", v); route(); }
function toggleRecent() { recentOpen = !recentOpen; route(); }
function toggleArchived() { archivedOpen = !archivedOpen; route(); }

            { label: "Add a source", desc: "PDF, link, video or audio", icon: ICONS.typeIcon.pdf.replace('w-4 h-4', 'w-5 h-5'), onclick: "go('sources')" },
            { label: "Ask a question", desc: "Query across your notebooks", icon: ICONS.spark.replace('w-3.5 h-3.5', 'w-5 h-5'), onclick: "go('ask')" },
            { label: "New notebook", desc: "Start a fresh collection", icon: ICONS.book.replace('w-3.5 h-3.5', 'w-5 h-5'), onclick: "toast('Notebook creation is not wired in the prototype')" },
            { label: "Generate podcast", desc: "Turn sources into audio", icon: ICONS.mic.replace('w-3 h-3', 'w-5 h-5'), onclick: "go('podcasts')" },
          ].map((a, i) => `
            <button onclick="${a.onclick}" class="rise group rounded-lg border border-line bg-surface px-4 py-4 text-left card-hover" style="--i:${i}">
              <span class="text-teal">${a.icon}</span>
              <p class="mt-2.5 text-sm font-semibold">${a.label}</p>
              <p class="mt-0.5 text-xs text-ink-soft">${a.desc}</p>
            </button>`).join("")}
        </div>
      </section>
    </div>
    ${pageFoot()}
  </div>`;
}
function go(page) { location.hash = "#/" + page; }

/* ══════════════════════════════════════════════════════════════════════════
   PAGE: NOTEBOOKS  (#/notebooks)
══════════════════════════════════════════════════════════════════════════ */
function pageNotebooks() {
  return `
  <div class="space-y-10">
    <div class="flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
      <h1 class="font-display text-3xl font-bold tracking-tight">Notebooks</h1>
      <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
        ${searchInput("search", "Search notebooks...")}
        <div class="flex items-center gap-2">
          <div class="flex items-center rounded-md border border-line bg-raised p-0.5">
            <button onclick="setView('tile')" id="btn-tile" aria-pressed="${view === "tile"}" title="Tile view" class="rounded-[4px] p-1.5 transition-colors">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
            </button>
            <button onclick="setView('list')" id="btn-list" aria-pressed="${view === "list"}" title="List view" class="rounded-[4px] p-1.5 transition-colors">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
            </button>
          </div>
          <button onclick="route()" title="Refresh" aria-label="Refresh" class="rounded-md border border-line bg-raised p-2 text-ink-soft hover:bg-recessed active:scale-[0.98] transition">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8M21 3v5h-5M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16M3 21v-5h5"/></svg>
          </button>
          ${btnPrimary("New Notebook", `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M12 5v14"/></svg>`).replace("<button", `<button onclick="toast('Notebook creation is not wired in the prototype')"`)}
        </div>
      </div>
    </div>

    <section id="recent-section" class="space-y-4"></section>
    <section id="active-section" class="space-y-4"></section>
    <section id="archived-section" class="space-y-4"></section>
    ${pageFoot()}
  </div>`;
}

function renderNotebooksPage() {
  const q = ($("#search")?.value || "").trim().toLowerCase();
  renderRecent(q);
  renderNotebookSection("#active-section", "Active Notebooks", NOTEBOOKS.filter((n) => !n.archived), q);
  renderNotebookSection("#archived-section", "Archived Notebooks", NOTEBOOKS.filter((n) => n.archived), q, {
    collapsible: true, open: archivedOpen, ontoggle: "toggleArchived()",
  });
  const on = "bg-recessed text-ink shadow-sm", off = "text-ink-faint hover:text-ink hover:bg-recessed";
  $("#btn-tile").className = `rounded-[4px] p-1.5 transition-colors ${view === "tile" ? on : off}`;
  $("#btn-list").className = `rounded-[4px] p-1.5 transition-colors ${view === "list" ? on : off}`;
  const s = $("#search");
  if (s) s.oninput = renderNotebooksPage;
}

/* ══════════════════════════════════════════════════════════════════════════
   PAGE: NOTEBOOK DETAIL  (#/notebooks/:id)
   Mirrors the app: NotebookHeader + 3 collapsible columns (Sources / Notes /
   Chat), each basis-1/3 collapsing to a w-12 rail; chat always expanded.
══════════════════════════════════════════════════════════════════════════ */
const NB_ICONS = {
  archive: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="5" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8M10 12h4"/></svg>`,
  trash: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>`,
  listChecks: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 17 2 2 4-4M3 7l2 2 4-4M13 6h8M13 12h8M13 18h8"/></svg>`,
  chat: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/></svg>`,
  chevL: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>`,
  plus: `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M12 5v14"/></svg>`,
  clock: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>`,
};

function toggleNbCol(col) {
  if (col === "src") nbColSrc = !nbColSrc; else nbColNotes = !nbColNotes;
  route();
}
function nbBulk(kind, mode) {
  if (kind === "src") SOURCES.forEach((s) => { nbSrcCtx[s.id] = mode === "include"; });
  else NOTES.forEach((x) => { nbNoteCtx[x.id] = mode === "include"; });
  toast("Context updated for all");
  route();
}
function syncNbCtx() { toast("Context updated (prototype)"); route(); }

function nbRail(col, color, label) {
  return `
    <button onclick="toggleNbCol('${col}')" aria-label="Expand ${label}" title="${label}"
      class="flex h-full min-h-[280px] w-full flex-col items-center gap-3 rounded-md border border-line bg-surface px-2 py-4 text-ink-faint transition-colors hover:bg-recessed hover:text-ink lg:w-12">
      <span aria-hidden class="h-3.5 w-[3px] rounded-full ${color}"></span>
      <span class="rotate-180 text-[11px] font-semibold uppercase tracking-[0.13em] [writing-mode:vertical-rl]">${label}</span>
    </button>`;
}
function nbCollapseBtn(col, label) {
  return `<button onclick="toggleNbCol('${col}')" aria-label="Collapse ${label}" title="Collapse ${label}" class="rounded-md p-1.5 text-ink-faint transition-colors hover:bg-recessed hover:text-ink">${NB_ICONS.chevL}</button>`;
}

function nbSourceCard(s, i) {
  const on = nbSrcCtx[s.id] !== false;
  const level = nbSrcLevel[s.id] || "full";
  return `
  <div class="rise rounded-md border border-line bg-raised/40 p-3 ${on ? "" : "opacity-60"}" style="--i:${i}">
    <div class="flex items-start gap-2.5">
      <span class="mt-0.5 flex h-7 w-7 shrink-0 items-center justify-center rounded-md bg-recessed text-slate-hue">${ICONS.typeIcon[s.type].replace('class="w-4 h-4"', 'class="w-3.5 h-3.5"')}</span>
      <div class="min-w-0 flex-1">
        <a href="#/sources/${s.id}" class="block truncate text-[13px] font-medium leading-snug transition-colors hover:text-fern">${esc(s.title)}</a>
        <p class="mt-0.5 truncate font-mono text-[10.5px] text-ink-faint">${esc(s.meta)}</p>
      </div>
      <label class="flex shrink-0 cursor-pointer items-center gap-1 text-[10.5px] text-ink-faint" title="Include in chat context">
        <input type="checkbox" ${on ? "checked" : ""} onchange="nbSrcCtx[${s.id}]=this.checked; syncNbCtx()" class="accent-[var(--fern)]" />Context
      </label>
    </div>
    <div class="mt-2.5 flex items-center justify-between gap-2 border-t border-line pt-2">
      ${STATUS[s.status]}
      <label class="flex items-center gap-1.5 text-[10.5px] text-ink-faint ${on ? "" : "opacity-50"}">Content
        <select ${on ? "" : "disabled"} onchange="nbSrcLevel[${s.id}]=this.value; syncNbCtx()" class="cursor-pointer rounded-[4px] border border-line bg-surface px-1 py-0.5 text-[10.5px] text-ink-soft disabled:cursor-not-allowed">
          <option value="full" ${level === "full" ? "selected" : ""}>Full text</option>
          <option value="insights" ${level === "insights" ? "selected" : ""}>Insights only</option>
        </select>
      </label>
    </div>
  </div>`;
}

function nbNoteCard(x, i) {
  const on = nbNoteCtx[x.id] !== false;
  return `
  <div class="rise rounded-md border border-line bg-raised/40 p-3 ${on ? "" : "opacity-60"}" style="--i:${i}">
    <div class="flex items-start justify-between gap-2">
      <p class="min-w-0 flex-1 text-[13px] font-medium leading-snug">${esc(x.title)}</p>
      <label class="flex shrink-0 cursor-pointer items-center gap-1 text-[10.5px] text-ink-faint" title="Include in chat context">
        <input type="checkbox" ${on ? "checked" : ""} onchange="nbNoteCtx[${x.id}]=this.checked; syncNbCtx()" class="accent-[var(--fern)]" />Context
      </label>
    </div>
    <p class="mt-1.5 line-clamp-3 text-xs leading-relaxed text-ink-soft">${esc(x.excerpt)}</p>
    <div class="mt-2 flex items-center justify-between">
      ${NOTE_KIND[x.kind]}
      <span class="font-mono text-[10.5px] text-ink-faint">${x.when}</span>
    </div>
  </div>`;
}

function nbColumn({ railColor, label, count, headerBtns, body }) {
  return `
  <div class="flex h-full min-h-[280px] flex-col overflow-hidden rounded-md border border-line bg-surface">
    <div class="flex shrink-0 items-center justify-between gap-2 border-b border-line px-4 py-3">
      <p class="flex min-w-0 items-center gap-2 text-[11px] font-semibold uppercase tracking-[0.13em] text-ink-faint">
        <span aria-hidden class="h-3.5 w-[3px] shrink-0 rounded-full ${railColor}"></span>
        <span class="truncate">${label}</span>
        <span class="font-mono text-[10.5px] tabular-nums">${count}</span>
      </p>
      <div class="flex shrink-0 items-center gap-1.5">${headerBtns}</div>
    </div>
    <div class="min-h-0 flex-1 space-y-2 overflow-y-auto p-3">${body}</div>
  </div>`;
}

function pageNotebookDetail(id) {
  const n = NOTEBOOKS.find((x) => x.id === Number(id)) || NOTEBOOKS[0];
  const nbSources = SOURCES.filter((s) => s.notebook === n.name);
  const nbNotes = NOTES.filter((x) => x.notebook === n.name);
  const incSources = nbSources.filter((s) => nbSrcCtx[s.id] !== false);
  const incNotes = nbNotes.filter((x) => nbNoteCtx[x.id] !== false);
  const insOnly = incSources.filter((s) => (nbSrcLevel[s.id] || "full") === "insights").length;
  const srcChip = insOnly ? `${incSources.length} sources · ${insOnly} insights-only` : `${incSources.length} sources`;
  const colCls = (open) => open ? "lg:flex-shrink-0 lg:flex-grow-0 lg:basis-1/3" : "lg:w-12 lg:flex-shrink-0";
  const mobCls = (tab) => nbMobileTab === tab ? "" : "hidden lg:block";
  const addBtn = (msg) => `<button onclick="toast('${msg}')" class="flex items-center gap-1 rounded-md bg-fern px-2.5 py-1.5 text-xs font-display font-bold text-[#f1f8f3] transition hover:bg-fern-deep active:scale-[0.98]">${NB_ICONS.plus}Add</button>`;

  return `
  <div class="flex h-full flex-col">
    <!-- header (mirrors NotebookHeader: name · actions · fern underline · description · dates) -->
    <div class="shrink-0 border-b border-line px-6 pb-5 pt-6 lg:px-8">
      <div class="flex items-start justify-between gap-3">
        <div class="flex min-w-0 items-center gap-3">
          <h1 class="truncate font-display text-2xl font-bold tracking-tight">${esc(n.name)}</h1>
          ${n.archived ? `<span class="shrink-0 rounded-md bg-recessed px-2 py-0.5 text-xs font-medium text-ink-soft ring-1 ring-inset ring-line">Archived</span>` : ""}
        </div>
        <div class="flex shrink-0 items-center gap-2">
          <button onclick="toast('Archiving is not wired in the prototype')" class="flex items-center gap-1.5 rounded-md border border-line bg-raised px-3 py-2 text-sm font-medium text-ink-soft transition hover:bg-recessed hover:text-ink active:scale-[0.98]">${NB_ICONS.archive}Archive</button>
          <button onclick="toast('Deletion is not wired in the prototype')" class="flex items-center gap-1.5 rounded-md border border-line bg-raised px-3 py-2 text-sm font-medium text-danger transition hover:bg-recessed active:scale-[0.98]">${NB_ICONS.trash}Delete</button>
        </div>
      </div>
      <div aria-hidden class="mt-3.5 h-[3px] w-14 rounded-[1px] bg-fern"></div>
      <p class="mt-3 max-w-[65ch] text-sm text-ink-soft">${esc(n.description)}</p>
      <p class="mt-2 text-xs text-ink-faint">Created 4 months ago · ${esc(n.updated)}</p>
    </div>

    <!-- columns -->
    <div class="flex min-h-0 flex-1 flex-col gap-4 p-6 lg:flex-row lg:gap-6 lg:p-8">
      <!-- mobile tabs (mirrors mobile Sources / Notes / Chat tabs) -->
      <div class="grid shrink-0 grid-cols-3 gap-1 rounded-md border border-line bg-raised p-1 lg:hidden">
        ${[["sources", "Sources", NB_ICONS.listChecks && `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z M14 2v6h6"/></svg>`],
           ["notes", "Notes", `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3Z M15 3v6h6"/></svg>`],
           ["chat", "Chat", NB_ICONS.chat]].map(([key, label, icon]) => `
          <button onclick="nbMobileTab='${key}'; route()" aria-pressed="${nbMobileTab === key}"
            class="flex items-center justify-center gap-1.5 rounded-[4px] py-1.5 text-xs font-medium transition-colors ${nbMobileTab === key ? "bg-surface text-ink shadow-sm ring-1 ring-inset ring-line" : "text-ink-faint hover:text-ink"}">${icon}${label}</button>`).join("")}
      </div>

      <!-- sources column (sage rail) -->
      <div class="min-h-0 min-w-0 ${mobCls("sources")} ${colCls(nbColSrc)}">
        ${nbColSrc ? nbColumn({
          railColor: "bg-sage",
          label: "Sources",
          count: nbSources.length,
          headerBtns: `
            <button onclick="nbBulk('src','include')" title="Include all in context" class="rounded-md p-1.5 text-ink-faint transition-colors hover:bg-recessed hover:text-ink">${NB_ICONS.listChecks}</button>
            ${addBtn("Source upload is not wired in the prototype")}
            ${nbCollapseBtn("src", "Sources")}`,
          body: nbSources.length
            ? nbSources.map((s, i) => nbSourceCard(s, i)).join("")
            : `<p class="rounded-md border border-dashed border-line px-3 py-8 text-center text-xs text-ink-faint">No sources yet — add one to get started.</p>`,
        }) : nbRail("src", "bg-sage", "Sources")}
      </div>

      <!-- notes column (gold rail) -->
      <div class="min-h-0 min-w-0 ${mobCls("notes")} ${colCls(nbColNotes)}">
        ${nbColNotes ? nbColumn({
          railColor: "bg-gold",
          label: "Notes",
          count: nbNotes.length,
          headerBtns: `
            <button onclick="nbBulk('notes','include')" title="Include all in context" class="rounded-md p-1.5 text-ink-faint transition-colors hover:bg-recessed hover:text-ink">${NB_ICONS.listChecks}</button>
            ${addBtn("Note editor is not wired in the prototype")}
            ${nbCollapseBtn("notes", "Notes")}`,
          body: nbNotes.length
            ? nbNotes.map((x, i) => nbNoteCard(x, i)).join("")
            : `<p class="rounded-md border border-dashed border-line px-3 py-8 text-center text-xs text-ink-faint">No notes yet — write one or generate an insight.</p>`,
        }) : nbRail("notes", "bg-gold", "Notes")}
      </div>

      <!-- chat column (teal rail, always expanded) -->
      <div class="min-w-0 flex-1 ${mobCls("chat")}">
        <div class="flex h-full min-h-[280px] flex-col overflow-hidden rounded-md border border-line bg-surface">
          <div class="flex shrink-0 items-center justify-between border-b border-line px-4 py-3">
            <p class="flex items-center gap-2 text-[11px] font-semibold uppercase tracking-[0.13em] text-ink-faint">
              <span aria-hidden class="h-3.5 w-[3px] rounded-full bg-teal"></span>Chat with notebook
            </p>
            <button onclick="toast('Chat sessions are not wired in the prototype')" aria-label="Sessions" class="rounded-md p-1.5 text-ink-faint transition-colors hover:bg-recessed hover:text-ink">${NB_ICONS.clock}</button>
          </div>
          <!-- context indicators -->
          <div class="flex shrink-0 flex-wrap items-center gap-1.5 border-b border-line px-4 py-2.5">
            ${[["bg-sage", srcChip], ["bg-gold", `${incNotes.length} notes`], ["bg-teal", "~32k tokens"]].map(([c, l]) => `
              <span class="inline-flex items-center gap-1.5 rounded-[4px] bg-recessed px-2 py-1 font-mono text-[10.5px] text-ink-soft ring-1 ring-inset ring-line"><span class="h-1.5 w-1.5 rounded-full ${c}"></span>${l}</span>`).join("")}
          </div>
          <div class="min-h-0 flex-1 space-y-4 overflow-y-auto p-4">
            ${CHAT.slice(0, 3).map((m, i) => chatMessage(m, i)).join("")}
          </div>
          <div class="shrink-0 space-y-2 border-t border-line p-3">
            <select aria-label="Model" class="w-full cursor-pointer rounded-md border border-line bg-raised px-2 py-1.5 font-mono text-xs text-ink-soft focus:outline-none focus:ring-2 focus:ring-teal/40">
              ${MODELS.filter((m) => m.models.length).flatMap((m) => m.models.map((md) => `<option ${md === m.defaultModel ? "selected" : ""}>${md}</option>`)).join("")}
            </select>
            <div class="flex items-end gap-2">
              <textarea rows="2" placeholder="Ask across this notebook…" class="flex-1 resize-none rounded-md border border-line bg-raised px-3 py-2 text-sm placeholder:text-ink-faint focus:outline-none focus:ring-2 focus:ring-teal/40 transition-shadow"></textarea>
              <button onclick="toast('Chat is not wired in the prototype')" aria-label="Send" class="flex h-9 w-9 shrink-0 items-center justify-center rounded-md bg-fern text-[#f1f8f3] transition hover:bg-fern-deep active:scale-95">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4Z M22 2 11 13"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

/* ══════════════════════════════════════════════════════════════════════════
   PAGE: SOURCES  (#/sources)  + SOURCE DETAIL
══════════════════════════════════════════════════════════════════════════ */
function sourceRow(s, i) {
  return `
    <a href="#/sources/${s.id}" class="group flex items-center gap-4 px-4 py-3 transition-colors hover:bg-recessed/60">
      <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-md bg-recessed text-slate-hue">${ICONS.typeIcon[s.type]}</span>
      <div class="min-w-0 flex-1">
        <div class="flex items-center gap-2">
          <span class="truncate font-medium">${esc(s.title)}</span>
        </div>
        <p class="mt-0.5 truncate text-xs text-ink-faint">${esc(s.origin)} · ${esc(s.meta)} · ${esc(s.notebook)}</p>
      </div>
      <div class="hidden shrink-0 sm:block">${STATUS[s.status]}</div>
      <span class="hidden w-24 shrink-0 text-right font-mono text-[11px] text-ink-faint md:block">${s.added}</span>
      <button aria-label="Actions" onclick="event.preventDefault(); toast('Source actions menu is not wired in the prototype')" class="shrink-0 rounded-md p-1 text-ink-faint opacity-0 group-hover:opacity-100 transition-opacity hover:bg-recessed">${ICONS.kebab}</button>
    </a>`;
}

function pageSources() {
  const filters = [
    { key: "all", label: "All" },
    { key: "pdf", label: "PDFs" },
    { key: "video", label: "Videos" },
    { key: "url", label: "Links" },
    { key: "audio", label: "Audio" },
    { key: "text", label: "Text" },
  ];
  return `
  <div class="space-y-8">
    <div class="flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
      <div>
        <h1 class="font-display text-3xl font-bold tracking-tight">Sources</h1>
        <p class="mt-1 text-sm text-ink-soft">Everything you have collected, across all notebooks.</p>
      </div>
      <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
        ${searchInput("src-search", "Search sources...")}
        ${btnPrimary("Add Source", `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M12 5v14"/></svg>`).replace("<button", `<button onclick="toast('Source upload is not wired in the prototype')"`)}
      </div>
    </div>

    <div class="rail -mx-1 flex gap-2 overflow-x-auto px-1 pb-1">
      ${filters.map((f) => `

      <span data-scope-label class="max-w-[180px] truncate">${esc(scopeLabel())}</span>
      <svg class="w-3 h-3 text-ink-faint" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>

function toggleScopePanel(open) {
  scopePanelOpen = open === undefined ? !scopePanelOpen : open;
  $("#scope-panel").classList.toggle("translate-x-full", !scopePanelOpen);
  $("#scope-overlay").classList.toggle("hidden", !scopePanelOpen);
}
function onScopeToggle() {
  const allBox = document.querySelector("#scope-panel-body input[data-all]");
  const boxes = [...document.querySelectorAll("#scope-panel-body input[data-nb]")];
  if (event.target.hasAttribute("data-all")) {
    boxes.forEach((b) => { b.checked = allBox.checked; });
  }
  let sel = boxes.filter((b) => b.checked).map((b) => b.dataset.nb);
  if (sel.length === 0) {
    // never allow an empty scope: restore everything if the master was unchecked,
    // otherwise keep the last-toggled notebook selected
    if (event.target.hasAttribute("data-all")) {
      allBox.checked = true;
      boxes.forEach((b) => { b.checked = true; });
      sel = boxes.map((b) => b.dataset.nb);
    } else {
      event.target.checked = true;
      sel = [event.target.dataset.nb];
    }
  }
  allBox.checked = sel.length === boxes.length;
  allBox.indeterminate = sel.length > 0 && sel.length < boxes.length;
  askScope = sel.length === boxes.length ? [] : sel;
  syncScopeUI();
}
function syncScopeUI() {
  document.querySelectorAll("[data-scope-label]").forEach((el) => { el.textContent = scopeLabel(); });
  if (currentPage === "ask" && askMode === "search") renderSearchResults();
}
function renderScopePanel() {
  const all = NOTEBOOKS.filter((n) => !n.archived);

    <label class="flex cursor-pointer items-center gap-2.5 rounded-md px-3 py-2 text-sm transition-colors hover:bg-recessed">
      <input type="checkbox" ${attrs} ${checked ? "checked" : ""} onchange="onScopeToggle()" class="accent-[var(--fern)]" />
      <span class="truncate ${bold ? "font-medium" : "text-ink-soft"}">${label}</span>
    </label>`;
  $("#scope-panel-body").innerHTML =
    box("data-all", isAll, "All notebooks", isAll) +
    all.map((n) => box(`data-nb="${esc(n.name)}"`, isAll || askScope.includes(n.name), esc(n.name), isAll || askScope.includes(n.name))).join("");
}

function renderSearchResults() {
  const q = askSearchQ.trim().toLowerCase();
  const list = SEARCH_RESULTS.filter((r) =>
    (!askScope.length || askScope.includes(r.notebook)) &&
    (!q || r.title.toLowerCase().includes(q) || r.source.toLowerCase().includes(q) ||
      r.snippet.toLowerCase().includes(q) || r.notebook.toLowerCase().includes(q)));
  const groups = {};
  list.forEach((r) => (groups[r.notebook] = groups[r.notebook] || []).push(r));
  const notebooks = Object.keys(groups);
  const count = $("#ask-count"), box = $("#ask-results");
  if (!count || !box) return;
  count.textContent = list.length
    ? `${list.length} match${list.length === 1 ? "" : "es"} in ${notebooks.length} notebook${notebooks.length === 1 ? "" : "s"}`
    : "";
  if (!list.length) {
    box.innerHTML = emptyState("No matches", "Try a different term — search covers titles, transcripts, notes and annotations.", null);
    return;
  }
  box.innerHTML = notebooks.map((nb, i) => `
    <section class="rise space-y-2.5" style="--i:${i}">
      <div class="flex items-center gap-2.5 border-b border-line pb-2">

        ${groups[nb].map((r) => `
          <a href="#/sources/1" class="group flex items-start gap-3.5 px-4 py-3.5 transition-colors hover:bg-recessed/60">
            <span class="mt-0.5 flex h-8 w-8 shrink-0 items-center justify-center rounded-md bg-recessed text-slate-hue">${r.type === "note" ? ICONS.note.replace('class="w-3 h-3"', 'class="w-4 h-4"') : ICONS.typeIcon[r.type]}</span>

            </div>

      </div>
    </section>`).join("");
}

/* ══════════════════════════════════════════════════════════════════════════
   ROUTER
══════════════════════════════════════════════════════════════════════════ */
function route() {
  const hash = location.hash.replace(/^#\/?/, "");
  const [page, param] = hash.split("/");
  currentPage = page || "home";
  const scroll = $("#scroll");
  const pageEl = $("#page");
  scroll.scrollTop = 0;
  scroll.classList.remove("overflow-hidden");
  pageEl.className = "p-6 lg:p-8 max-w-[1400px] mx-auto";
  markActiveNav();

  switch (currentPage) {
    case "home": $("#page").innerHTML = pageHome(); break;
    case "notebooks":
      if (param) {
        // fixed 3-column layout — columns scroll independently
        scroll.classList.add("overflow-hidden");
        pageEl.className = "h-full";
        pageEl.innerHTML = pageNotebookDetail(param);
        break;
      }
      pageEl.innerHTML = pageNotebooks();
      renderNotebooksPage();
      break;
    case "sources":
      if (param) {
        // fixed two-column layout — each column scrolls independently
        scroll.classList.add("overflow-hidden");
        pageEl.className = "h-full";
        pageEl.innerHTML = pageSourceDetail(param);
        break;
      }
      pageEl.innerHTML = pageSources();
      renderSourcesList();
      break;
    case "ask":
      pageEl.innerHTML = pageAsk();
      if (askMode === "ask") {
        // only the chat area scrolls — freeze the page container, composer stays pinned
        scroll.classList.add("overflow-hidden");
        pageEl.className = "h-full";
      } else {
        renderSearchResults();
      }
      break;
    case "podcasts": $("#page").innerHTML = pagePodcasts(); break;
    case "models": $("#page").innerHTML = pageModels(); break;
    case "transformations": $("#page").innerHTML = pageTransformations(); break;
    case "settings": $("#page").innerHTML = pageSettings(); break;
    case "advanced": $("#page").innerHTML = pageAdvanced(); break;
    default:
      currentPage = "home";
      $("#page").innerHTML = pageHome();
      markActiveNav();
  }
}
window.addEventListener("hashchange", route);

renderNav();
renderScopePanel();
route();
</script>
</body>
</html>
