name: Render ticket schedules

on:
  issues:
    types: [opened, closed, edited, reopened, deleted]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render schedules
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/render_schedule.py

      - name: Commit regenerated schedules
        run: |
          git add -u docs/7-DEVELOPMENT
          if git diff --cached --quiet; then
            echo "schedules already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: regenerate ticket schedules [skip ci]"
            git push
          fi
